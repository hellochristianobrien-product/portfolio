<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Control Tower">
  <defs>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131316"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="ct-glow" cx="0.5" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#e6c79c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e6c79c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ct-bg)"/>
  <rect width="800" height="500" fill="url(#ct-glow)"/>

  <!-- one place to see everything: the dashboard -->
  <g stroke="#8a8a93" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <rect x="120" y="84" width="560" height="332" rx="16"/>
    <line x1="120" y1="138" x2="680" y2="138"/>
    <line x1="262" y1="138" x2="262" y2="416"/>
  </g>

  <!-- command bar, glowing -->
  <rect x="290" y="104" width="240" height="22" rx="11" fill="#e6c79c" fill-opacity="0.22" stroke="#e6c79c" stroke-opacity="0.55" stroke-width="1.4"/>

  <!-- sidebar items -->
  <g fill="#8a8a93" fill-opacity="0.5">
    <rect x="144" y="168" width="92" height="9" rx="4.5"/>
    <rect x="144" y="196" width="74" height="9" rx="4.5"/>
    <rect x="144" y="224" width="84" height="9" rx="4.5"/>
    <rect x="144" y="252" width="64" height="9" rx="4.5"/>
  </g>

  <!-- studio health: sparkline panel -->
  <rect x="290" y="166" width="222" height="116" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#8a8a93" stroke-opacity="0.25" stroke-width="1.2"/>
  <polyline points="308,254 348,240 388,248 428,214 468,222 494,196" fill="none" stroke="#e6c79c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="494" cy="196" r="4" fill="#e6c79c"/>

  <!-- capacity bars panel -->
  <rect x="530" y="166" width="126" height="116" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#8a8a93" stroke-opacity="0.25" stroke-width="1.2"/>
  <g fill="#8a8a93" fill-opacity="0.6">
    <rect x="548" y="240" width="16" height="26" rx="3"/>
    <rect x="574" y="222" width="16" height="44" rx="3"/>
    <rect x="600" y="206" width="16" height="60" rx="3"/>
  </g>
  <rect x="626" y="190" width="16" height="76" rx="3" fill="#e6c79c" fill-opacity="0.85"/>

  <!-- activity rows -->
  <g fill="#8a8a93" fill-opacity="0.4">
    <rect x="290" y="306" width="366" height="9" rx="4.5"/>
    <rect x="290" y="334" width="320" height="9" rx="4.5"/>
    <rect x="290" y="362" width="346" height="9" rx="4.5"/>
  </g>
  <g>
    <circle cx="672" cy="310" r="4" fill="#82fa9a" fill-opacity="0.8"/>
    <circle cx="672" cy="338" r="4" fill="#e6c79c" fill-opacity="0.8"/>
    <circle cx="672" cy="366" r="4" fill="#82fa9a" fill-opacity="0.8"/>
  </g>
</svg>
