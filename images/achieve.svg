<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Freedom Financial / Achieve">
  <defs>
    <linearGradient id="ac-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1640"/>
      <stop offset="1" stop-color="#0d0a24"/>
    </linearGradient>
    <radialGradient id="ac-glow" cx="0.72" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#3300ff" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#3300ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3300ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ac-arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3300ff"/>
      <stop offset="1" stop-color="#9caefc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ac-bg)"/>
  <rect width="800" height="500" fill="url(#ac-glow)"/>

  <!-- the climb out: an ascending arc gaining momentum -->
  <path d="M60 420 C 240 420 420 380 560 270 C 640 207 690 140 716 84"
        fill="none" stroke="url(#ac-arc)" stroke-width="5" stroke-linecap="round"/>
  <!-- milestones along the path -->
  <g fill="#9caefc">
    <circle cx="200" cy="411" r="5" fill-opacity="0.5"/>
    <circle cx="362" cy="390" r="5" fill-opacity="0.65"/>
    <circle cx="512" cy="308" r="5" fill-opacity="0.8"/>
    <circle cx="636" cy="186" r="5" fill-opacity="0.9"/>
  </g>
  <!-- the goal, reached -->
  <circle cx="716" cy="84" r="13" fill="#9caefc" fill-opacity="0.18"/>
  <circle cx="716" cy="84" r="6" fill="#c9d4ff"/>

  <!-- weight left behind -->
  <g fill="#3300ff" fill-opacity="0.30">
    <circle cx="92" cy="438" r="9"/>
    <circle cx="128" cy="446" r="6"/>
  </g>
</svg>
