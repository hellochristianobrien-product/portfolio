<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hanover Park">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1c14"/>
      <stop offset="1" stop-color="#060d09"/>
    </linearGradient>
    <radialGradient id="hp-glow" cx="0.80" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#2aad83" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#2aad83" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2aad83" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hp-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#20af4d"/>
      <stop offset="1" stop-color="#82fa9a"/>
    </linearGradient>
    <linearGradient id="hp-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aad83" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2aad83" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- brand color field -->
  <rect width="800" height="500" fill="url(#hp-bg)"/>
  <rect width="800" height="500" fill="url(#hp-glow)"/>

  <!-- faint ledger grid: the spreadsheets being replaced -->
  <g stroke="#f8fcfc" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="380" y1="0" x2="380" y2="500"/>
    <line x1="520" y1="0" x2="520" y2="500"/>
    <line x1="660" y1="0" x2="660" y2="500"/>
  </g>

  <!-- scattered data points -->
  <g fill="#82fa9a" fill-opacity="0.22">
    <circle cx="150" cy="140" r="3"/>
    <circle cx="300" cy="100" r="2.5"/>
    <circle cx="560" cy="120" r="2.5"/>
    <circle cx="220" cy="300" r="2.5"/>
  </g>

  <!-- rising data line: reactive -> proactive -->
  <path d="M70 440 L70 392 L168 372 L256 388 L344 330 L432 344 L520 286 L612 232 L704 168 L744 138 L744 440 Z" fill="url(#hp-area)"/>
  <polyline points="70,392 168,372 256,388 344,330 432,344 520,286 612,232 704,168 744,138"
            fill="none" stroke="url(#hp-line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#82fa9a">
    <circle cx="168" cy="372" r="4"/>
    <circle cx="256" cy="388" r="4"/>
    <circle cx="344" cy="330" r="4"/>
    <circle cx="432" cy="344" r="4"/>
    <circle cx="520" cy="286" r="4"/>
    <circle cx="612" cy="232" r="4"/>
    <circle cx="704" cy="168" r="4"/>
  </g>
  <circle cx="744" cy="138" r="11" fill="#82fa9a" fill-opacity="0.20"/>
  <circle cx="744" cy="138" r="5.5" fill="#82fa9a"/>
</svg>
