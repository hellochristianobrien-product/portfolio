<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Utility">
  <defs>
    <linearGradient id="ut-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15171b"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <radialGradient id="ut-glow" cx="0.30" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#4f8df0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4f8df0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ut-bg)"/>
  <rect width="800" height="500" fill="url(#ut-glow)"/>

  <!-- utilitarian modular grid: the toolkit -->
  <g stroke="#9fb6dd" stroke-opacity="0.30" stroke-width="1.6" fill="none">
    <rect x="140" y="100" width="100" height="100" rx="18"/>
    <rect x="260" y="100" width="100" height="100" rx="18"/>
    <rect x="380" y="100" width="100" height="100" rx="18"/>
    <rect x="500" y="100" width="100" height="100" rx="18"/>
    <rect x="140" y="220" width="100" height="100" rx="18"/>
    <rect x="380" y="220" width="100" height="100" rx="18"/>
    <rect x="500" y="220" width="100" height="100" rx="18"/>
    <rect x="260" y="340" width="100" height="100" rx="18"/>
  </g>

  <!-- the cells doing the work -->
  <rect x="260" y="220" width="100" height="100" rx="18" fill="#4f8df0"/>
  <rect x="620" y="220" width="100" height="100" rx="18" fill="#4f8df0" fill-opacity="0.35"/>
  <circle cx="430" cy="270" r="10" fill="#9fb6dd" fill-opacity="0.55"/>
  <circle cx="190" cy="150" r="10" fill="#9fb6dd" fill-opacity="0.35"/>

  <!-- ten cells: a decade of building -->
</svg>
