<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gallagher">
  <defs>
    <linearGradient id="gl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2240"/>
      <stop offset="1" stop-color="#061325"/>
    </linearGradient>
    <radialGradient id="gl-glow" cx="0.5" cy="0.85" r="0.9">
      <stop offset="0" stop-color="#3f8fd4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3f8fd4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#gl-bg)"/>
  <rect width="800" height="500" fill="url(#gl-glow)"/>

  <!-- protection: sheltering arcs over what matters -->
  <g fill="none" stroke-linecap="round">
    <path d="M180 320 a 220 220 0 0 1 440 0" stroke="#3f8fd4" stroke-opacity="0.30" stroke-width="3"/>
    <path d="M232 320 a 168 168 0 0 1 336 0" stroke="#3f8fd4" stroke-opacity="0.50" stroke-width="3.5"/>
    <path d="M284 320 a 116 116 0 0 1 232 0" stroke="#6db3e8" stroke-opacity="0.75" stroke-width="4"/>
    <path d="M336 320 a 64 64 0 0 1 128 0" stroke="#9fd0f5" stroke-width="4.5"/>
  </g>

  <!-- the people protected -->
  <g fill="#cfe6f8">
    <circle cx="400" cy="306" r="10"/>
    <circle cx="358" cy="316" r="7" fill-opacity="0.8"/>
    <circle cx="442" cy="316" r="7" fill-opacity="0.8"/>
  </g>

  <!-- steady ground -->
  <line x1="150" y1="372" x2="650" y2="372" stroke="#3f8fd4" stroke-opacity="0.35" stroke-width="2"/>
  <g fill="#3f8fd4" fill-opacity="0.4">
    <circle cx="216" cy="418" r="4"/>
    <circle cx="318" cy="430" r="4"/>
    <circle cx="430" cy="424" r="4"/>
    <circle cx="540" cy="432" r="4"/>
    <circle cx="620" cy="416" r="4"/>
  </g>
</svg>
